# docker compose up --build
services:

  tiny-gordon:
    build: 
      context: .
      dockerfile: Dockerfile

    ports:
      - 8000:8000
    command: ["adk", "web", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    models:
      qwen2_5:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_CHAT_MODEL    
      mxbai_embed:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_EMBEDDING_MODEL

  tiny-gordon-api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - 9000:8000
    command: ["adk", "api_server", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    models:
      qwen2_5:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_CHAT_MODEL    
      mxbai_embed:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_EMBEDDING_MODEL


  redis-server:
    image: redis:8.0.0-alpine3.21
    environment: 
      - REDIS_ARGS=--save 30 1
      # snapshot
    ports:
      - 6379:6379
    volumes:
      - ./data:/data
      #- ${LOCAL_WORKSPACE_FOLDER}/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  data-loader:
    profiles: ["init"]
    build: 
      context: ./data-loader
      dockerfile: Dockerfile
    models:
      mxbai_embed:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_EMBEDDING_MODEL
    depends_on:
      redis-server:
        condition: service_healthy

# NOTE: Define models
models:
  qwen2_5:
    model: ai/qwen2.5:latest
  mxbai_embed:
    model: ai/mxbai-embed-large:latest

